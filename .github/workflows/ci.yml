# Project CI/CD pipeline.
# Triggered on push and pull request to main and develop (assignment requirement).
#
# Stage 1 (Test)  : HTML validation + CSS lint
# Stage 2 (Build) : Docker image build
# Bonus           : image vulnerability scan (Trivy)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: "Stage 1 — Tests (HTML/CSS)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint HTML (htmlhint)
        run: npx --yes htmlhint "index.html" "html/**/*.html"

      - name: Lint CSS (stylelint)
        run: |
          npm install --no-save stylelint stylelint-config-standard
          echo '{ "extends": "stylelint-config-standard", "rules": { "declaration-block-single-line-max-declarations": null, "custom-property-empty-line-before": null } }' > .stylelintrc.json
          npx stylelint "css/**/*.css"

  build:
    name: "Stage 2 — Docker image build"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t medina-atlas:${{ github.sha }} .

      - name: Save the image for the next job
        run: docker save medina-atlas:${{ github.sha }} -o image.tar

      - name: Upload the image as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  scan:
    name: "Bonus — Vulnerability scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load the image
        run: docker load -i image.tar

      - name: Scan the image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medina-atlas:${{ github.sha }}
          format: table
          exit-code: "0"          # informational: does not block the pipeline
          severity: CRITICAL,HIGH
